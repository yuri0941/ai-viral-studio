<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нет интернета — AI Viral Studio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0f;
            color: #e5e7eb;
            font-family: Inter, system-ui, -apple-system, sans-serif;
            padding: 2rem;
        }
        .box {
            text-align: center;
            max-width: 320px;
        }
        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
            border-radius: 24px;
            background: linear-gradient(135deg, #10b981, #3b82f6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.75rem; }
        p { color: #9ca3af; line-height: 1.5; margin-bottom: 1.5rem; }
        button {
            background: #10b981;
            color: #fff;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            min-height: 44px;
        }
        button:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">📡</div>
        <h1>Нет интернета</h1>
        <p>Некоторые функции недоступны. Проверьте подключение и попробуйте снова.</p>
        <button onclick="location.reload()">Обновить</button>
    </div>
</body>
</html>
