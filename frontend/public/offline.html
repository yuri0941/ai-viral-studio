<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Offline — AI Viral Studio</title>
    <meta name="theme-color" content="#0a0a0f">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #0a0a0f;
            color: #e2e2e2;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .icon {
            width: 80px;
            height: 80px;
            border-radius: 24px;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin-bottom: 24px;
        }
        h1 { margin: 0 0 12px; font-size: 24px; }
        p { margin: 0 0 24px; color: #888; line-height: 1.5; max-width: 320px; }
        button {
            padding: 14px 24px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            color: white;
            font-weight: 600;
            cursor: pointer;
            min-height: 48px;
        }
    </style>
</head>
<body>
    <div class="icon">⚡</div>
    <h1>Нет соединения</h1>
    <p>OMEGA временно недоступна офлайн. Проверьте подключение к интернету и попробуйте снова.</p>
    <button onclick="window.location.reload()">Повторить</button>
</body>
</html>
